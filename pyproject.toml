[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "engine-nd"
version = "0.1.0"
description = "N-dimensional stochastic process engine for financial modeling"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["engine_nd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
